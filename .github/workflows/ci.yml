name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
          $HOME/.elan/bin/elan toolchain install leanprover/lean4:v4.12.0
          $HOME/.elan/bin/elan default leanprover/lean4:v4.12.0
      - name: Build
        run: |
          ~/.elan/bin/lake update
          ~/.elan/bin/lake exe cache get || true
          ~/.elan/bin/lake build
